<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: wss: data: blob: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https:; media-src 'self' blob: data:; frame-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; worker-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier – éditeur visuel</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="editor/editor.css">
<script src="editor/boot.js"></script>
</head>
<body>
<header class="topbar">
  <div class="tb-group tb-brand"><span class="logo" aria-hidden="true">◧</span><input id="siteName" class="site-name" aria-label="Nom du site" spellcheck="false"></div>
  <div class="tb-group">
    <label class="vh" for="pageSelect">Page</label>
    <select id="pageSelect" class="control"></select>
  </div>
  <div class="tb-group">
    <button class="icon-btn" id="undoBtn" type="button" title="Annuler (Ctrl+Z)" aria-label="Annuler (dernière modification)"><span class="ico" data-icon="undo"></span></button>
    <button class="icon-btn" id="redoBtn" type="button" title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir"><span class="ico" data-icon="redo"></span></button>
  </div>
  <div class="tb-group seg-group" role="group" aria-label="Appareil">
    <button class="seg" type="button" data-device="desktop" title="Ordinateur"><span class="ico" data-icon="desktop"></span><span class="seg__label">Ordinateur</span></button>
    <button class="seg" type="button" data-device="tablet" title="Tablette (820 px)"><span class="ico" data-icon="tablet"></span><span class="seg__label">Tablette</span></button>
    <button class="seg" type="button" data-device="mobile" title="Mobile (390 px)"><span class="ico" data-icon="mobile"></span><span class="seg__label">Mobile</span></button>
  </div>
  <div class="tb-group">
    <label class="vh" for="langSelect">Langue</label>
    <select id="langSelect" class="control"></select>
    <button class="badge-btn" id="missingBtn" type="button" hidden></button>
    <button class="btn btn--small" id="i18nBtn" type="button" title="Traductions : tableau de tous les textes" aria-label="Traductions"><span class="ico" data-icon="translate"></span><span class="btn__label">Traductions</span></button>
    <button class="btn btn--small" id="seoBtn" type="button" title="Référencement (SEO) : notes, aperçu Google, conseils" aria-label="Référencement (SEO)"><span class="ico" data-icon="seo"></span><span class="btn__label">SEO</span></button>
  </div>
  <div class="tb-group tb-collab">
    <div class="peers" id="peers" aria-label="Participants"></div>
    <button class="btn btn--small" id="collabBtn" type="button" title="Travailler à plusieurs (pair-à-pair)" aria-label="Travailler à plusieurs"><span class="ico" data-icon="users"></span></button>
    <button class="btn btn--small" id="commentsBtn" type="button" title="Commentaires" aria-label="Commentaires" aria-pressed="false"><span class="ico" data-icon="comment"></span></button>
    <button class="btn btn--small" id="aiBtn" type="button" title="IA locale (Gemini Nano dans Chrome)" aria-label="IA locale"><span class="ico" data-icon="sparkle"></span></button>
  </div>
  <div class="tb-group tb-end">
    <span class="save-state" id="saveState" aria-live="polite"></span>
    <button class="btn btn--small" id="helpBtn" type="button" title="Guide d’utilisation (F1)" aria-label="Guide d’utilisation"><span class="ico" data-icon="help"></span></button>
    <button class="btn btn--small log-btn" id="logBtn" type="button" title="Journal de débogage" aria-label="Journal de débogage"><span class="ico" data-icon="bug"></span></button>
    <details class="menu" id="fileMenu">
      <summary class="btn">Fichier</summary>
      <div class="menu__panel">
        <button type="button" id="guideBtn">Guide d’utilisation</button>
        <button type="button" id="previewBtn">Aperçu dans un nouvel onglet</button>
        <button type="button" id="versionsBtn">Versions…</button>
        <button type="button" id="exportJsonBtn">Enregistrer le projet (.json)</button>
        <label class="menu__file">Ouvrir un projet (.json)<input type="file" id="importJson" accept="application/json,.json"></label>
        <button type="button" id="loadDemoBtn">Recharger l’exemple</button>
        <button type="button" id="newSiteBtn">Nouveau site vide</button>
        <label class="menu__lang">Langue de l’interface <select id="uiLangSelect" class="control control--sm"><option value="fr">Français</option><option value="en">English</option><option value="ja">日本語</option></select></label>
      </div>
    </details>
    <button class="btn" id="exportZipBtn" type="button" title="Exporter le site : vérifier puis télécharger le .zip" aria-label="Exporter le site"><span class="ico" data-icon="download"></span><span class="btn__label">Exporter</span></button>
    <button class="btn btn--primary" id="publishBtn" type="button" title="Publier sur OVH ou GitHub" aria-label="Publier"><span class="ico" data-icon="rocket"></span><span class="btn__label">Publier</span></button>
  </div>
</header>

<div class="workspace">
  <aside class="panel panel--left" aria-label="Outils">
    <nav class="tabs" role="tablist" aria-label="Panneau de gauche">
      <button type="button" role="tab" data-left="widgets" aria-selected="true">Widgets</button>
      <button type="button" role="tab" data-left="templates" aria-selected="false">Modèles</button>
      <button type="button" role="tab" data-left="navigator" aria-selected="false">Structure</button>
      <button type="button" role="tab" data-left="pages" aria-selected="false">Pages</button>
      <button type="button" role="tab" data-left="content" aria-selected="false">Contenus</button>
      <button type="button" role="tab" data-left="site" aria-selected="false">Site</button>
    </nav>
    <div class="panel__body" id="leftBody"></div>
  </aside>

  <section class="stage" id="stage" aria-label="Canevas">
    <div class="edit-banner" id="editBanner" role="status" hidden></div>
    <div class="frame" id="frame" data-device="desktop">
      <iframe id="canvas" title="Page en cours d’édition"></iframe>
    </div>
  </section>

  <aside class="panel panel--right" id="inspector" aria-label="Inspecteur"></aside>
  <aside class="panel panel--right panel--review" id="reviewPanel" aria-label="Commentaires" hidden></aside>
</div>

<div class="narrow-note" role="note">L’éditeur est prévu pour un écran d’au moins 1024 px de large. Le bouton « Mobile » montre la page telle qu’elle s’affiche sur un téléphone.</div>
<div class="drag-ghost" id="dragGhost" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
